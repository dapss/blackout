# Test, then deploy the static build to Cloudflare Pages. The deploy only runs if the tests pass.
#
#   push to main         → preview site   https://preview.blackout-redact.pages.dev
#   push a tag v1.2.3    → live site      https://blackout-redact.pages.dev, plus a GitHub Release
#                          with that version's notes from CHANGELOG.md
#
# So the live site only changes on a release, and its footer always matches a tag. Pushes that
# only touch docs skip the run (tags always run).
#
# Needs, in the repo's Settings → Secrets and variables → Actions:
#   secret   CLOUDFLARE_API_TOKEN   an API token with "Account · Cloudflare Pages · Edit" only
#   variable CLOUDFLARE_ACCOUNT_ID  the Cloudflare account that owns the Pages project
name: Test and deploy

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md", "LICENSE", "NOTICE"]
  workflow_dispatch:

permissions:
  contents: read

# Never run two deploys at once; a newer push replaces a waiting one.
concurrency:
  group: deploy-pages
  cancel-in-progress: false

jobs:
  test:
    # Safari's engine (WebKit) is tested on macOS: Safari only ships on Apple platforms, and
    # Playwright's Linux WebKit build draws canvases in software, about 6x slower than real Safari.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Chromium and Firefox
            os: ubuntu-latest
            browsers: chromium firefox
            projects: --project=chromium --project=firefox --project=mobile-chrome
          - name: WebKit (Safari)
            os: macos-latest
            browsers: webkit
            projects: --project=webkit --project=mobile-safari
    name: test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version comes from "packageManager" in package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps ${{ matrix.browsers }}
      - run: pnpm test:e2e ${{ matrix.projects }}
        env:
          CI: "true"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces-${{ matrix.os }}
          path: test-results
          retention-days: 7

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
    environment:
      name: ${{ startsWith(github.ref, 'refs/tags/v') && 'production' || 'preview' }}
      url: ${{ startsWith(github.ref, 'refs/tags/v') && 'https://blackout-redact.pages.dev' || 'https://preview.blackout-redact.pages.dev' }}
    permissions:
      contents: write # create the GitHub Release
      id-token: write # sign with GitHub's Sigstore identity
      attestations: write # publish the signatures on the repo
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # A release must be what it says: the tag, package.json and the changelog all name the same version.
      - name: Check the tag matches the version
        if: env.RELEASE == 'true'
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          awk -v v="$version" '$0 ~ "^## "v" " {f=1; next} /^## / {f=0} f' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md has no entry for $version"
            exit 1
          fi

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Sign every file that is about to be served, so anyone can check that what the site gives
      # them was built from this repo by this workflow: gh attestation verify <file> --repo dapss/blackout
      - name: Sign build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/**
      # Cloudflare treats the "main" branch as production and any other name as a preview.
      - name: Deploy to Cloudflare Pages
        run: >
          npx --yes wrangler@4.156.1 pages deploy dist
          --project-name blackout-redact
          --branch ${{ env.RELEASE == 'true' && 'main' || 'preview' }}
          --commit-hash "$GITHUB_SHA"
          --commit-message "$(git log -1 --format=%s)"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Create the GitHub Release
        if: env.RELEASE == 'true'
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md --verify-tag --latest
        env:
          GH_TOKEN: ${{ github.token }}
